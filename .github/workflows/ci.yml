name: CI
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_DB: event_booking_test, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/event_booking_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/event_booking_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-that-is-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-that-is-at-least-32-characters
      COOKIE_SECRET: ci-cookie-secret-that-is-at-least-32-characters
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npx prisma migrate deploy --schema backend/prisma/schema.prisma
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

